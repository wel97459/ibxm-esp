[env:s2mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps = file://../..
build_flags =
    -DIBXM_STREAMING=0
    -DHC_BCLK=5
    -DHC_WS=6
    -DHC_DATA=7

[env:s3devkitc1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; N16R8: quad flash + octal PSRAM
lib_deps = file://../..
build_flags =
    -DIBXM_STREAMING=0
    -DBOARD_HAS_PSRAM
    -DTFT_SPI_HOST=SPI2_HOST
    -DHC_BCLK=5
    -DHC_WS=6
    -DHC_DATA=7
    ; octal PSRAM reserves GPIO 35-37 -> D-pad moves to 39/40/41/42
    '-DHC_DPAD_PINS={39, 40, 41, 42}'
