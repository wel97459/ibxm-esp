; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32
; Use a board definition that DECLARES PSRAM. The stock 'esp-wrover-kit'
; board def does NOT set -DBOARD_HAS_PSRAM, so SPIRAM init is silently
; skipped and psramFound()==0. 'upesy_wrover' declares -DBOARD_HAS_PSRAM
; + -mfix-esp32-psram-cache-issue, which makes the framework generate the
; correct SPIRAM sdkconfig and bring up the 4 MB PSRAM. (Verified with the
; psram_probe project: psramFound()=1, ~4 MB free.)
board = upesy_wrover
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
board_build.partitions = partitions.csv
; Pull the ibxm decoder + ring buffer from the parent repo (this example's
; library). file://../.. points at the ibxm-esp root, which PlatformIO
; treats as a src-layout library.
lib_deps = file://../..
; NOTE: qio is intentionally NOT forced here. Forcing the prebuilt Arduino
; bootloader to QIO via elf2image corrupts the boot image on this board and
; breaks boot (garbage 12MB load + DOWNLOAD_BOOT). Keep DIO so the board
; stays bootable.
board_build.flash_mode = dio
; This board has real PSRAM, so use the eager/PSRAM decode path: decode the
; whole S3M into SPIRAM at load (no per-tick ensure_* calls). Set to 1 to
; use the DRAM-streaming path instead (for a board with dead PSRAM).
build_flags = -DIBXM_STREAMING=0 -DCONFIG_LOG_DEFAULT_LEVEL=3
; After `pio run -t upload`, flash the bundled S3M into the xm_music partition.
; Override the track with:  TRACK_FILE=other.s3m pio run -t upload
extra_scripts =
    flash_qio.py
    flash_track.py

; ---------------------------------------------------------------------------
; Lolin S2 Mini (ESP32-S2, 2 MB PSRAM, native USB-CDC).
;   - board def declares BOARD_HAS_PSRAM -> 2 MB PSRAM comes up automatically.
;   - S2 has a single I2S and freely-muxable GPIO; defaults below are safe
;     free pins (no flash/SPI/USB clash). Override per your DAC wiring:
;       pio run -e s2mini -t upload -D "build_flags=... -DI2S_BCK_PIN=33 ..."
;   - Upload/monitor is the S2's native USB CDC (board def sets
;     use_1200bps_touch + wait_for_upload_port), so leave upload_port empty
;     and let PlatformIO detect the CDC device.
; ---------------------------------------------------------------------------
[env:s2mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = dio
; Pull the ibxm decoder + ring buffer from the parent repo.
lib_deps = file://../..
; Eager/PSRAM decode (2 MB PSRAM is plenty for the S3M). Override with
; -DIBXM_STREAMING=1 only for a board with dead PSRAM.
build_flags =
    -DIBXM_STREAMING=0
    -DCONFIG_LOG_DEFAULT_LEVEL=3
    -DI2S_BCK_PIN=5
    -DI2S_WS_PIN=6
    -DI2S_DATA_PIN=7
extra_scripts =
    flash_qio.py
    flash_track.py
